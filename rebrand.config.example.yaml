# =============================================================================
# Client rebrand configuration
#
# 1. Copy this file:  cp rebrand.config.example.yaml rebrand.config.yaml
# 2. Fill in ALL fields below.
# 3. In Claude Code, run:  /rebrand
#
# Claude will read this file and orchestrate the entire customization
# end-to-end (config + theme + content + env vars + verification).
#
# This file is GIT-IGNORED to keep client data out of version control.
# =============================================================================

brand:
  # Full brand name (Cyrillic OK). Shown in <title>, Footer, Privacy, Terms.
  name: "Хаан дэлгүүр"
  # Short variant (used in tight spaces — mobile header, OG card).
  shortName: "Хаан"
  # Public site URL (no trailing slash).
  url: "https://khaan.mn"
  # Admin subdomain.
  adminUrl: "https://admin.khaan.mn"
  # Description for <meta>. 1-2 sentences, Mongolian.
  description: "Чанартай гоо сайхны бүтээгдэхүүн, хурдан хүргэлт. Хаан дэлгүүрт тавтай морил."

# All hex values MUST be 6-character format with leading #
theme:
  primary: "#C9A961"            # Main brand color (CTAs, links)
  primaryHover: "#B49856"       # ~10% darker
  primaryActive: "#9F8649"      # ~20% darker
  primaryForeground: "#FFFFFF"  # Text color on primary background — usually white or black
  secondary: "#1A1A1A"
  secondaryForeground: "#F8FAFC"
  accent: "#D4AF37"
  accentForeground: "#FFFFFF"

contact:
  phone: "+976 7011-2233"
  email: "info@khaan.mn"
  supportEmail: "support@khaan.mn"
  # Privacy contact email (shown on /privacy-policy page)
  privacyEmail: "privacy@khaan.mn"
  # Full address in Mongolian
  address: "Улаанбаатар хот, ХУД, Зайсан тойруу 7, Khaan Tower 5 давхар"

# Social handles. Set value to ~ (null) to hide.
social:
  instagram: "khaan.mn"
  facebook: "khaanshop"
  tiktok: ~
  youtube: ~

# Payment provider toggles
payments:
  qpay: true
  lendmn: false
  storepay: false
  transfer: true

# Feature flags — set to false to hide the feature surface from the UI
features:
  reviews: true
  wishlist: true
  coupons: true
  articles: true
  events: false        # Хаан дэлгүүр does not run events
  pointSystem: true
  notifications: true

# Auth channel for customer login (wishlist gate, login modal, profile
# phone verification).
#   phone = SMS OTP — requires an SMS provider (e.g. Twilio) configured in
#           the client's Supabase project. Without one, login always errors.
#   email = Email OTP — works with Supabase out of the box.
auth:
  method: "phone"

delivery:
  # Free shipping above this amount (MNT)
  freeShippingThreshold: 80000

legal:
  jurisdiction: "Mongolia"
  jurisdictionMn: "Монгол Улс"
  companyRegistration: ~      # Optional company registration number

# =============================================================================
# Design direction
# =============================================================================
# Drives /rebrand Phase 2 (design system swap: fonts, radius, shadow, density)
# and Phase 3 (interactive page redesign).
#
# Set the whole `design:` block to ~ (null) if you want to KEEP the inherited
# Monpang visual language — in that case /rebrand only does text/config swap.
#
# WARNING: per CLAUDE.md hard rule, new client sites MUST NOT ship looking
# like Monpang. If you skip the design section, you are taking on the manual
# redesign work yourself.
# =============================================================================

design:
  # 1-3 reference websites. AI fetches them via WebFetch to understand the
  # spacing rhythm, color usage, typography hierarchy, and button language.
  # Use sites whose style you want to emulate — NOT Mongolian competitors.
  references:
    - url: "https://apple.com"
      take: "spacing rhythm, typography hierarchy"
    - url: "https://stripe.com"
      take: "color palette discipline, button shapes"

  # Overall aesthetic adjective. Drives micro-decisions on tone.
  # Options: minimalist | luxury | playful | tech | gaming | editorial | brutalist | retro | sporty
  aesthetic: "minimalist tech"

  # Visual density.
  # Options: compact (Amazon-style) | comfortable (default) | spacious (Apple-style)
  density: "comfortable"

  # Button corner radius.
  # Options: sharp | rounded-sm (4px) | rounded-md (8px) | rounded-lg (12px) | pill (full)
  buttonShape: "rounded-md"

  # Typography pair (Google Fonts names).
  typography:
    heading: "Playfair Display"   # display/heading font
    body: "Inter"                 # body/UI font
    mono: ~                       # optional code/numeric font

  # Color depth.
  # Options: monochrome (1 hue + B&W) | duotone (2 hues) | multi
  colorDepth: "duotone"

  # Default color mode.
  # Options: light | dark | auto (respects prefers-color-scheme)
  defaultMode: "light"

  # Component shadow/depth feel.
  # Options: flat | soft (subtle shadow) | heavy (strong shadow) | glass (glassmorphic)
  componentVibe: "soft"

# =============================================================================
# Secrets (Supabase, payment provider keys, Redis, etc.) are NOT stored here.
# After /rebrand finishes, fill them in apps/frontend/.env.local and
# apps/admin/.env.local — those files are gitignored.
# =============================================================================
